<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat</title>
    <!-- Tailwind CSS загвар -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg flex flex-col h-[600px] p-4">
        <h1 class="text-lg font-bold text-center mb-4 text-gray-700">Gemini AI Чат (10 яриа)</h1>
        
        <!-- Чат гарч ирэх хэсэг -->
        <div id="chat-box" class="flex-1 overflow-y-auto border border-gray-200 rounded-lg p-3 space-y-3 bg-gray-50 flex flex-col">
            <!-- Мессежүүд энд нэмэгдэнэ -->
        </div>

        <!-- Бичих хэсэг -->
        <form id="chat-form" class="mt-3 flex gap-2">
            <input type="text" id="user-input" placeholder="Асуултаа энд бичнэ үү..." 
                class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Илгээх</button>
        </form>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const ai = new GoogleGenAI({ apiKey: "AQ.Ab8RN6JtOZ98eB1hY-RZwUOXcZNqSeDICe0BEF9w2oNmY98GkQ", dangerouslyAllowBrowser: true });
        
        let conversationHistory = []; 
        const chatBox = document.getElementById("chat-box");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");

        function renderChat() {
            chatBox.innerHTML = "";
            conversationHistory.forEach(msg => {
                const div = document.createElement("div");
                div.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
                
                const bubble = document.createElement("div");
                bubble.className = `max-w-[75%] p-3 rounded-lg text-sm ${
                    msg.role === 'user' 
                    ? 'bg-blue-600 text-white rounded-br-none' 
                    : 'bg-gray-200 text-gray-800 rounded-bl-none'
                }`;
                bubble.innerText = msg.content;
                
                div.appendChild(bubble);
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Хэрэглэгчийн мессежийг нэмэх
            conversationHistory.push({ role: "user", content: text });
            if (conversationHistory.length > 10) { conversationHistory.shift(); }
            userInput.value = "";
            renderChat();

            // 2. Түр хүлээнэ үү (Loader) элементийг чат бокс дотор үүсгэж харуулах
            const loadingDiv = document.createElement("div");
            loadingDiv.id = "loading-message";
            loadingDiv.className = "flex justify-start items-center gap-2 text-gray-500 text-sm bg-gray-200 p-3 rounded-lg max-w-[65%] rounded-bl-none";
            loadingDiv.innerHTML = `<div class="loader"></div> Түр хүлээнэ үү...`;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 3. Gemini руу хүсэлт явуулах
                const response = await ai.models.generateContent({
                    model: 'gemini-3.6-flash',
                    contents: text,
                    config: {
                        systemInstruction: "Та бол туслагч AI юм. Хэрэглэгчийн асуусан асуултад ямагт ойлгомжтой, цэгцтэй монгол хэлээр хариулж бай.",
                    }
                });

                const replyText = response.text;

                // 4. AI-ийн хариуг түүхэнд нэмэх
                conversationHistory.push({ role: "model", content: replyText });
                if (conversationHistory.length > 10) { conversationHistory.shift(); }

            } catch (error) {
                console.error(error);
                
                // Алдаа гарсан үед 1 минутын дараах цагийг тооцож гаргах
                const now = new Date();
                now.setMinutes(now.getMinutes() + 1);
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const formattedTime = `${hours}:${minutes}`;

                const friendlyMessage = `Систем түр зуур ачаалалтай байна. Та ${formattedTime} цагт эргээд холбогдоно уу.`;

                conversationHistory.push({ role: "model", content: friendlyMessage });
                if (conversationHistory.length > 10) { conversationHistory.shift(); }
            } finally {
                // Loader-ийг устгаад шинэчлэгдсэн чатыг харуулах
                renderChat();
            }
        });
    </script>
</body>
</html>
