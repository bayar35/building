<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обой & SPC Шал Угсралт - Засвар</title>
    <style>
        /* --- ГАЛЕРЕЙ СЕКЦИЙН CSS ЗАСВАР --- */

        /* 1. Секцийг 80% өргөнтэй болгож, хоёр захнаас нь голлуулах */
        .gallery-section {
            width: 80%;
            margin: 50px auto; /* Дээд доод талдаа 50px, хоёр хажуугаасаа автоматаар голлогдоно */
            font-family: sans-serif;
            text-align: center;
        }

        .gallery-section h2 {
            font-size: 2rem;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .gallery-section p {
            color: #718096;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        /* 2. Зургуудыг байршуулах уян хатан Grid бүтэц (Одоогийнхоос 2 дахин жижиг) */
        .gallery-grid {
            display: grid;
            /* Зургийн хамгийн бага өргөнийг 150px болгож жижигсгэв. Дэлгэцийн хэмжээнд таарч баганын тоо өөрчлөгдөнө */
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px; /* Зургууд хоорондын зай */
        }

        /* 3. Зургийн харьцааг алдуулахгүй хадгалах container */
        .gallery-item {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 120px; /* Өндрийг тогтмол барьж харьцаа алдуулахгүй */
            object-fit: cover; /* Зургийг сунгаж гажуудуулахгүйгээр тааруулж зүснэ */
            display: block;
            transition: transform 0.2s ease;
        }

        /* Хулгана очих үед бага зэрэг тодрох эффект (Үндсэн grid дотор) */
        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* 4. ХУЛГАНА ОЧИХОД ДЭЛГЭЦ ДҮҮРЭН ТОМРОХ ЭФФЕКТ (Lightbox overlay) */
        .gallery-item:hover {
            z-index: 9999;
        }

        /* Хулгана очих үед зургийг дэлгэцийн өмнө авчирч томруулах */
        .gallery-item:hover img {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: auto;
            height: auto;
            max-width: 90vw;   /* Дэлгэцийн өргөний 90%-аас хэтрэхгүй */
            max-height: 90vh;  /* Дэлгэцийн өндрийн 90%-аас хэтрэхгүй */
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border-radius: 8px;
            border: 3px solid #fff;
        }

        /* Зургийг томрох үед арын сайтыг бүдгэрүүлж харанхуй болгох дэвсгэр */
        .gallery-item:hover::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7); /* Арын хэсгийг 70% харанхуй болгоно */
            z-index: -1;
        }

        /* Facebook рүү шилжих товчны загвар */
        .fb-btn-container {
            margin-top: 40px;
        }

        .fb-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #1877f2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .fb-btn:hover {
            background-color: #166fe5;
        }
    </style>
</head>
<body>

    <!-- ГАЛЕРЕЙ СЕКЦ БҮТНЭЭРЭЭ -->
    <section class="gallery-section">
        <h2>Бидний хийсэн ажлууд</h2>
        <p>Хийсэн ажлын зураг, видео мэдээллийг эндээс үзээрэй</p>
        
        <div class="gallery-grid">
            <!-- Зургуудын жагсаалт (src="..." хэсэгт зургийнхаа замыг оруулна уу) -->
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 1"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 2"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 3"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 4"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 5"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 6"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 7"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 8"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 9"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 10"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 11"></div>
            <div class="gallery-item"><img src="https://placeholder.com" alt="Ажлын зураг 12"></div>
            <!-- Шаардлагатай бол доор нь нэмж хуулж тавиад зургийн замаа солиорой -->
        </div>

        <div class="fb-btn-container">
            <a href="#" class="fb-btn">Бүх зургийг Facebook-ээс үзэх</a>
        </div>
    </section>

</body>
</html>
