<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f0f2f5">
<title>3D Өрөөний Визуализатор</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#222;padding:12px;overflow-x:hidden}
h2{margin:4px 0 3px;text-align:center;font-size:20px}
.subtitle{margin:0 0 15px;text-align:center;color:#667085;font-size:12px}
.main-container{width:100%;max-width:900px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.08);display:flex;gap:20px;align-items:flex-start}
.stage{width:390px;height:390px;flex:0 0 390px;background:#cbd5e1;border-radius:9px;position:relative;overflow:hidden;perspective:1200px;display:flex;justify-content:center;align-items:center;cursor:grab;user-select:none;touch-action:none}
.stage.dragging{cursor:grabbing}
.room{width:400px;height:200px;position:relative;transform-style:preserve-3d;transform:rotateX(20deg) rotateY(-45deg) scale(.65);will-change:transform}
.panel{position:absolute;box-sizing:border-box;transform-style:preserve-3d;backface-visibility:visible}
#back-wall{width:400px;height:200px;transform:translateZ(-100px);background:#f1f2f6;border:2px solid #cbd5e1}
#left-wall{width:200px;height:200px;left:100px;transform:translateX(-200px) rotateY(90deg);background:#e2e8f0;border:2px solid #cbd5e1}
#right-wall{width:200px;height:200px;left:100px;transform:translateX(200px) rotateY(-90deg);background:#e2e8f0;border:2px solid #cbd5e1}
#front-wall{width:400px;height:200px;transform:translateZ(100px);background:rgba(241,242,246,.94);border:2px solid #cbd5e1;cursor:pointer}
#front-wall.hidden{opacity:0}
#floor{width:400px;height:200px;transform:translateY(100px) rotateX(90deg);background:#8b5a2b;border:2px solid #5c3a21;box-shadow:inset 0 0 30px rgba(0,0,0,.25)}
.roof-slope{position:absolute;width:400px;height:112px;left:0;top:0;background:#991b1b;border:2px solid #7f1d1d;transform-style:preserve-3d;box-shadow:0 3px 5px rgba(0,0,0,.15);transition:background .2s ease}
#roof-back{transform-origin:center center;transform:translateY(-127px) translateZ(-50px) rotateX(26deg)}
#roof-front{transform-origin:center center;transform:translateY(-127px) translateZ(50px) rotateX(-26deg)}
#roof-ridge{position:absolute;width:400px;height:8px;left:0;top:0;transform:translateY(-155px) translateZ(0);background:#7f1d1d;border-radius:4px;z-index:5;transition:background .2s ease}
.window{position:absolute;background:linear-gradient(135deg,#e0f2fe,#bae6fd);border:6px solid #475569;box-shadow:inset 0 0 15px rgba(0,0,0,.18)}
#back-wall .window{width:160px;height:100px;top:40px;left:120px}
#left-wall .window{width:80px;height:100px;top:40px;left:60px}
.door{position:absolute;width:70px;height:140px;right:20px;bottom:0;background:#b45309;border:3px solid #78350f;transform-origin:left center;transition:transform .4s ease;cursor:pointer;box-shadow:-3px 0 10px rgba(0,0,0,.18)}
.door:after{content:"";position:absolute;right:8px;top:70px;width:8px;height:8px;background:#fbbf24;border-radius:50%}
.door.open{transform:rotateY(-110deg)}
.controls{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.control-row{display:flex;align-items:center;gap:10px}
.control-row label{width:155px;flex:0 0 155px;color:#475569;font-size:12px;font-weight:bold}
select{width:100%;padding:7px 9px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-size:11px;color:#222;min-height:30px}
.action-container{margin-top:4px;border-top:1px solid #e2e8f0;padding-top:7px}
.action-title{display:block;margin-bottom:5px;color:#475569;font-size:12px;font-weight:bold}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
button{border:0;padding:8px 5px;min-height:34px;border-radius:6px;background:#1e293b;color:#fff;font-size:11px;font-weight:bold;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.reset-btn{grid-column:span 2;background:#475569}
@media(max-width:760px){
body{padding:8px}
h2{font-size:18px}
.subtitle{font-size:11px;line-height:1.4}
.main-container{flex-direction:column;padding:10px;gap:12px;border-radius:10px}
.stage{width:100%;height:330px;flex:none}
.room{transform:rotateX(20deg) rotateY(-45deg) scale(.53)}
.controls{width:100%}
.control-row{width:100%}
.control-row label{width:120px;flex:0 0 120px;font-size:11px}
select{font-size:12px;min-height:38px}
.action-grid{gap:5px}
button{min-height:40px;font-size:12px}
}
@media(max-width:430px){
.stage{height:300px}
.control-row label{width:105px;flex:0 0 105px}
.room{transform:rotateX(20deg) rotateY(-45deg) scale(.48)}
}
@media(max-width:350px){
.control-row{flex-direction:column;align-items:stretch;gap:4px}
.control-row label{width:100%}
.stage{height:280px}
}
</style>
</head>
<body>

<h2>3D Өрөөний Визуализатор</h2>
<p class="subtitle">Компьютер дээр хулганаар, гар утсан дээр хуруугаараа чирж өрөөг эргүүлнэ</p>

<div class="main-container">

<div class="stage" id="stageArea">
<div class="room" id="roomBox">

<div class="panel" id="back-wall"><div class="window"></div></div>
<div class="panel" id="left-wall"><div class="window"></div></div>
<div class="panel" id="right-wall"></div>
<div class="panel" id="floor"></div>

<div class="roof-slope" id="roof-back"></div>
<div class="roof-slope" id="roof-front"></div>
<div id="roof-ridge"></div>

<div class="panel" id="front-wall" onclick="toggleFrontWall(event)">
<div class="door" id="roomDoor" onclick="toggleDoor(event)"></div>
</div>

</div>
</div>

<div class="controls">

<div class="control-row">
<label>Ар талын хана:</label>
<select onchange="changeColor('back-wall',this.value)">
<option value="#f1f2f6">Цагаан</option>
<option value="#b7e4c7">Цайвар ногоон</option>
<option value="#ffe5d9">Крем ягаан</option>
<option value="#e2e8f0">Саарал</option>
<option value="#fef08a">Цайвар шар</option>
<option value="#bae6fd">Цайвар цэнхэр</option>
<option value="#fbcfe8">Ягаан</option>
<option value="#fed7aa">Улбар шар</option>
<option value="#e9d5ff">Нил ягаан</option>
<option value="#1e293b">Хар хөх</option>
</select>
</div>

<div class="control-row">
<label>Зүүн талын хана:</label>
<select onchange="changeColor('left-wall',this.value)">
<option value="#e2e8f0">Саарал цайвар</option>
<option value="#f1f2f6">Цагаан</option>
<option value="#b7e4c7">Ногоон</option>
<option value="#ffe5d9">Крем</option>
<option value="#fef08a">Шар</option>
<option value="#bae6fd">Цэнхэр</option>
<option value="#fbcfe8">Ягаан</option>
<option value="#fed7aa">Тоор</option>
<option value="#e9d5ff">Лаванда</option>
<option value="#334155">Графит</option>
</select>
</div>

<div class="control-row">
<label>Баруун талын хана:</label>
<select onchange="changeColor('right-wall',this.value)">
<option value="#e2e8f0">Саарал цайвар</option>
<option value="#f1f2f6">Цагаан</option>
<option value="#b7e4c7">Ногоон</option>
<option value="#ffe5d9">Крем</option>
<option value="#fef08a">Шар</option>
<option value="#bae6fd">Цэнхэр</option>
<option value="#fbcfe8">Ягаан</option>
<option value="#fed7aa">Тоор</option>
<option value="#e9d5ff">Лаванда</option>
<option value="#334155">Графит</option>
</select>
</div>

<div class="control-row">
<label>Дээвэр:</label>
<select onchange="changeRoofColor(this.value)">
<option value="#991b1b">Улаан тоосгон</option>
<option value="#1e293b">Хар саарал</option>
<option value="#78350f">Бор модон</option>
<option value="#1e3a8a">Хөх</option>
<option value="#065f46">Ногоон</option>
<option value="#475569">Мөнгөлөг саарал</option>
</select>
</div>

<div class="control-row">
<label>Шал:</label>
<select onchange="changeColor('floor',this.value)">
<option value="#8b5a2b">Бараан модон</option>
<option value="#d4a373">Цайвар модон</option>
<option value="#386641">Ногоон модон</option>
<option value="#475569">Саарал плита</option>
<option value="#1e293b">Хар хавтан</option>
<option value="#f8fafc">Цагаан гантиг</option>
<option value="#b45309">Хүрэн бор</option>
<option value="#78350f">Гүн модон</option>
<option value="#94a3b8">Бетон саарал</option>
<option value="#713f12">Зэвэрсэн бор</option>
</select>
</div>

<div class="action-container">
<span class="action-title">Өрөөг эргүүлэх:</span>
<div class="action-grid">
<button onclick="rotateRoom('y',-30)">◀ Зүүн</button>
<button onclick="rotateRoom('y',30)">Баруун ▶</button>
<button onclick="rotateRoom('x',-15)">▲ Дээш</button>
<button onclick="rotateRoom('x',15)">▼ Доош</button>
</div>
</div>

<div class="action-container">
<span class="action-title">Томруулах / Жижигрүүлэх:</span>
<div class="action-grid">
<button onclick="zoomRoom(.1)">＋ Том</button>
<button onclick="zoomRoom(-.1)">－ Жижиг</button>
<button class="reset-btn" onclick="resetRoom()">Үндсэн</button>
</div>
</div>

</div>
</div>

<script>
let currentRotateY=-45;
let currentRotateX=20;
let currentScale=.65;

function changeColor(id,color){
    const el=document.getElementById(id);
    if(el) el.style.backgroundColor=color;
}

function changeRoofColor(color){
    document.getElementById("roof-back").style.backgroundColor=color;
    document.getElementById("roof-front").style.backgroundColor=color;
    document.getElementById("roof-ridge").style.backgroundColor=color;
}

function toggleDoor(event){
    event.stopPropagation();
    document.getElementById("roomDoor").classList.toggle("open");
}

function toggleFrontWall(event){
    if(event.target.classList.contains("door")) return;
    document.getElementById("front-wall").classList.toggle("hidden");
}

function updateTransform(){
    document.getElementById("roomBox").style.transform =
        `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg) scale(${currentScale})`;
}

function rotateRoom(axis,angle){
    if(axis==="y") currentRotateY+=angle;

    if(axis==="x"){
        currentRotateX+=angle;
        currentRotateX=Math.max(-10,Math.min(50,currentRotateX));
    }

    updateTransform();
}

function zoomRoom(amount){
    currentScale+=amount;
    currentScale=Math.max(.4,Math.min(1.2,currentScale));
    updateTransform();
}

function resetRoom(){
    currentRotateY=-45;
    currentRotateX=20;
    currentScale=.65;
    updateTransform();
}

/* PC mouse + Android + iPhone + tablet:
   Pointer Events ашигласан тул нэг кодоор бүгд ажиллана. */
const stage=document.getElementById("stageArea");
let isDragging=false;
let lastX=0;
let lastY=0;

stage.addEventListener("pointerdown",function(e){
    if(e.target.closest("button") || e.target.closest("select")) return;

    isDragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
    stage.classList.add("dragging");

    if(stage.setPointerCapture){
        try{stage.setPointerCapture(e.pointerId)}catch(err){}
    }
});

stage.addEventListener("pointermove",function(e){
    if(!isDragging) return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    currentRotateY+=dx*.65;
    currentRotateX-=dy*.65;

    currentRotateX=Math.max(-10,Math.min(50,currentRotateX));

    lastX=e.clientX;
    lastY=e.clientY;

    updateTransform();
});

function stopDragging(e){
    isDragging=false;
    stage.classList.remove("dragging");

    if(stage.releasePointerCapture){
        try{stage.releasePointerCapture(e.pointerId)}catch(err){}
    }
}

stage.addEventListener("pointerup",stopDragging);
stage.addEventListener("pointercancel",stopDragging);

stage.addEventListener("wheel",function(e){
    e.preventDefault();
    zoomRoom(e.deltaY<0 ? .05 : -.05);
},{passive:false});

/* Initial values */
changeColor("back-wall","#f1f2f6");
changeColor("left-wall","#e2e8f0");
changeColor("right-wall","#e2e8f0");
changeColor("floor","#8b5a2b");
changeRoofColor("#991b1b");
updateTransform();
</script>

</body>
</html>
